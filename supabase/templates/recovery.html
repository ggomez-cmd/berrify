<!DOCTYPE html>
<html lang="en">
  <body style="margin:0;padding:0;background-color:#F4F5F7;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#F4F5F7;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:420px;background-color:#ffffff;border:1px solid #E5E7EB;border-radius:16px;">
            <tr>
              <td align="center" style="padding:32px 28px 28px;">
                <img
                  src="https://berrify.app/email/berrify-wordmark.png"
                  width="148"
                  height="50"
                  alt="berrify"
                  style="display:block;margin:0 auto 8px;border:0;outline:none;text-decoration:none;"
                />
                <p style="margin:0 0 24px;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#6B7280;">
                  Restaurant ERP
                </p>
                <h1 style="margin:0 0 12px;font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:1.35;color:#111827;">
                  Reset your password
                </h1>
                <p style="margin:0 0 24px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.55;color:#6B7280;">
                  We received a request to reset your Berrify password. This link expires shortly and can only be used once.
                </p>
                <a
                  href="{{ .ConfirmationURL }}"
                  style="display:inline-block;background-color:#7B1924;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;text-decoration:none;padding:12px 28px;border-radius:12px;"
                >
                  Reset password
                </a>
                <p style="margin:24px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.55;color:#6B7280;">
                  If you didn&rsquo;t request this, you can ignore this email. Your password will stay the same.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
